[build]
  command = "pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

# Keep all application APIs on the same production-origin function.
# This prevents preview-server HTML error pages from reaching the tRPC client.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
